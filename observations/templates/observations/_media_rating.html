{% load seaslugs_i18n %}<div class="media-rating"{% if sample %} data-sample="{{ sample.pk }}" data-media="{{ media }}"{% else %} id="lightbox-rating" hidden{% endif %} data-label-mine="{{ "הדירוג שלך:"|t:lang }}" data-label-photographer="{{ "דירוג הצלם:"|t:lang }}" data-star="{{ "כוכבים"|t:lang }}" title="{{ "לחיצה נוספת על אותו כוכב מבטלת את הדירוג"|t:lang }}"><span class="media-rating-label">{{ "הדירוג שלך:"|t:lang }}</span><span class="media-rating-stars" role="group">{% for n in "12345" %}<button type="button" class="star" data-stars="{{ n }}" aria-pressed="false" aria-label="{{ n }} {{ "כוכבים"|t:lang }}">★</button>{% endfor %}</span></div>
