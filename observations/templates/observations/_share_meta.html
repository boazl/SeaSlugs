    <link rel="canonical" href="{{ canonical }}">
{% if bilingual %}    <link rel="alternate" hreflang="he" href="{{ he_url }}">
    <link rel="alternate" hreflang="en" href="{{ en_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ he_url }}">
{% endif %}    <meta property="og:site_name" content="SeaSlugs">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ canonical }}">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description|truncatechars:200 }}">
    <meta property="og:locale" content="{% if lang == 'en' %}en_US{% else %}he_IL{% endif %}">
{% if bilingual %}    <meta property="og:locale:alternate" content="{% if lang == 'en' %}he_IL{% else %}en_US{% endif %}">
{% endif %}{% if image %}    <meta property="og:image" content="{{ image }}">
    <meta property="og:image:alt" content="{{ title }}">
    <meta name="twitter:card" content="summary_large_image">
{% else %}    <meta name="twitter:card" content="summary">
{% endif %}{% if google_verification %}    <meta name="google-site-verification" content="{{ google_verification }}">
{% endif %}
