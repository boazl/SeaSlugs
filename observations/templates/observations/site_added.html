{% extends 'observations/base.html' %}{% load seaslugs_i18n %}{% block content %}
<style>nav{display:none}main{padding:12px}</style>
<h1>{{ "האתר נוסף"|t:lang }}</h1>
<p>{{ "האתר"|t:lang }} "{{ site.name }}" {{ "נוסף לרשימת אתרי הצלילה. אפשר לסגור את החלון."|t:lang }}</p>
<p><button type="button" onclick="window.close()">{{ "סגירה"|t:lang }}</button> <a href="{{ next }}">{{ "חזרה"|t:lang }}</a></p>
{{ site|json_script:"added-site" }}
<script>
const site = JSON.parse(document.getElementById('added-site').textContent);
if (window.opener) { window.opener.postMessage({type: 'site-added', site: site}, location.origin); window.close(); }
</script>
{% endblock %}
