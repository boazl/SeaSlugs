{% load i18n %}
<div class="dropdown-filter">
  <h3>{% blocktranslate with filter_title=title %} {{ filter_title }} {% endblocktranslate %}</h3>
  <select onchange="if(this.value){window.location=this.value}">
    {% for choice in choices %}
      <option value="{{ choice.query_string|iriencode }}" title="{{ choice.display }}"{% if choice.selected %} selected{% endif %}>{{ choice.display|truncatechars:32 }}</option>
    {% endfor %}
  </select>
</div>
